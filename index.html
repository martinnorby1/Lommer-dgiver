      const d=f.d||0, fmt=v=> f.g===false? String(v) : nf(v,d);
      w.innerHTML=`<div class="frow"><label for="${id}">${esc(fl(k,current))}</label><span class="val"><input id="${id}" type="text" inputmode="${d?"decimal":"numeric"}" enterkeyhint="done" autocomplete="off" value="${fmt(S[k])}">${f.u?`<small>${esc(f.u)}</small>`:""}</span></div>

  try{ r=t.calc(); }catch(e){ console.error(e); r={tone:"obs",head:"Jeg kunne ikke regne på de tal. Prøv at rette dem lidt.",short:"Tjek dine tal",body:"",stats:[]}; }
  r=duR(r,current); r.head=fx(r.head); r.body=fx(r.body);
  const [cls,lab]=tone[r.tone]||tone.info, rows=ledgerRows(current);
  const ests=needed(current).filter(k=>E()[k]);
  document.getElementById("answerContent").innerHTML=`<div class="ans-top"><img class="wz-av" src="${MARTIN_IMG}" alt="" width="40" height="40"><div class="ans-who">Martins svar<small>Dine tal · satser for 2026</small></div></div>
   <span class="pill ${cls}">${lab}</span><div class="ans-head">${r.head}</div>
   ${(()=>{ const m=meterFor(current); return m?meterHtml(m,current):(rows.length?"":keyFig(r)); })()}
   ${rows.length?ledgerView(rows):statsHtml(!meterFor(current)&&r.stats&&r.stats.length>1?Object.assign({},r,{stats:r.stats.slice(1)}):r)}
   ${ests.length?`<p class="est-note">Jeg har brugt mit skøn for: ${ests.map(k=>esc(SHORTLAB(k).toLowerCase())).join(", ")}. Ret det under "Ret dine svar", hvis du kender tallet.</p>`:""}`;
  const paras=(r.body||"").split(/<\/p>\s*<p>/).map(p=>p.replace(/^<p>|<\/p>$/g,"")).filter(Boolean);
  document.getElementById("recs").innerHTML=`<h3>Mine anbefalinger</h3>
   ${r.rule?`<div class="rule"><b>Martins tommelfingerregel</b><p>${r.rule}</p></div>`:""}
   <ol class="rec-list">${paras.map(p=>`<li>${p}</li>`).join("")}</ol>
   ${r.compare?compareHtml(r.compare):""}
   ${r.notes&&r.notes.length?`<div class="checks"><h3>${esc(du(r.notesTitle||"Det skal I tjekke ved boligen",current))}</h3><p class="wi-lead">${esc(du(r.notesLead||"Ud fra byggeår, boligtype og opvarmning.",current))}</p><ul>${r.notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>`:""}`;
  const ord=(t.ord||[]).filter(o=>GL[o]);
  const sit=S.sit&&SIT.find(s=>s.id===S.sit);
  const nxt=(sit?sit.q:Object.keys(T).filter(k=>T[k].grp===t.grp).concat(["buffer","opsparing"])).filter((k,i,a)=>k!==current&&a.indexOf(k)===i).slice(0,3);
  document.getElementById("extra").innerHTML=`
   ${rows.length&&r.stats&&r.stats.length?`<details class="more"><summary>Flere tal</summary>${statsHtml(r)}</details>`:""}
   ${r.chart?`<details class="more"><summary>Se grafen</summary><div class="chart"><h4>${esc(r.chart.h)}</h4>${r.chart.html}</div></details>`:""}
   ${ord.length?`<details class="more gloss"><summary>Forklaring af ${ord.length===1?"ordet":"ordene"}: ${ord.join(", ")}</summary><dl>${ord.map(o=>`<dt>${esc(o)}</dt><dd>${esc(GL[o])}</dd>`).join("")}</dl></details>`:""}
   ${r.fine?`<p class="fine">${r.fine}</p>`:""}
   ${nxt.length?`<div class="eyebrow" style="margin:22px 0 10px">Næste spørgsmål</div><div class="qlist">${nxt.map(qItem).join("")}</div>`:""}
   <button class="homelink" type="button" data-home>${I.hus}Tilbage til forsiden</button>`;
  renderScen(r);
  if(first) animIn();
  const short=r.short||"";
  document.getElementById("ledgerDock").textContent=rows.length?rows.at(-1)[0]+": "+kr(rows.at(-1)[1])+"/md.":"";
  document.getElementById("dockTxt").textContent=short; document.getElementById("dockLab").textContent=lab;
  document.getElementById("dockDot").style.background=TONEC[r.tone]||TONEC.info;
}
function renderScen(base){
  const list=scenarios(); const chips=document.getElementById("chips"); if(!chips) return;
  [...scen].forEach(i=>{ if(!list[i]) scen.delete(i); });
  chips.innerHTML=list.map((s,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="${scen.has(i)}">${esc(du(s.l,current))}</button>`).join("");
  chips.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; scen.has(i)?scen.delete(i):scen.add(i); renderScen(base); });
  const cmp=document.getElementById("cmp");
  if(!scen.size){ cmp.innerHTML=""; return; }
  const sel=[...scen].map(i=>list[i]);
  const w=runWith(()=>sel.forEach(s=>s.a()));
  if(!w){ cmp.innerHTML='<p class="wz-err">Det scenarie kunne jeg ikke regne på.</p>'; return; }
  const [c1,l1]=tone[base.tone]||tone.info, [c2,l2]=tone[w.r.tone]||tone.info;
  const lastRow=rows=>rows.length?`<p class="cmp-num">${esc(rows.at(-1)[0])}: <b>${kr(rows.at(-1)[1])}</b>/md.</p>`:"";
  const fixed=sel.some(s=>s.fixed);
  cmp.innerHTML=`<div class="cmp">
    <div class="cmp-col"><small>Som det er nu</small><span class="pill ${c1}">${l1}</span><p class="cmp-short">${esc(base.short||"")}</p>${lastRow(ledgerRows(current))}</div>
    <div class="cmp-col alt"><small>${esc(sel.map(s=>du(s.l,current)).join(" + "))}</small><span class="pill ${c2}">${l2}</span><p class="cmp-short">${esc(w.r.short||"")}</p>${lastRow(w.rows)}</div></div>
    <p class="cmp-head">${fx(w.r.head)}</p>
    ${fixed?`<p class="cmp-note">Renten kan du ikke selv vælge, så scenariet viser kun, hvad det ville betyde.</p>`:`<button type="button" class="wz-back" id="adopt">Brug disse tal</button>`}`;
  const ad=document.getElementById("adopt"); if(ad) ad.onclick=()=>{ const before=JSON.stringify(S); sel.forEach(s=>s.a());
    const b=JSON.parse(before); Object.keys(S).forEach(k=>{ if(F[k] && b[k]!==S[k]){ K()[k]=true; delete E()[k]; } });
    save(); scen.clear(); answerView(current); toast("Tallene er opdateret"); };
}
dock.addEventListener("animationend",()=>dock.classList.remove("changed"));
let tt; function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2200); }

document.getElementById("dockBtn").onclick=()=>{ const a=document.getElementById("answer"); if(a){ a.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); a.focus({preventScroll:true}); } };
app.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"), s=e.target.closest("[data-sit]"), h=e.target.closest("[data-home]"), sb=e.target.closest("[data-sitback]");
  if(g) location.hash=g.dataset.go; else if(s) location.hash="s-"+s.dataset.sit; else if(sb) location.hash="s-"+sb.dataset.sitback; else if(h){ S.sit=null; save(); const was=location.hash; location.hash=""; if(!was||was==="#") route(); }
});
let lastDepth=0;
const depthOf=h=> T[h]?2 : h.startsWith("s-")?1 : 0;
function route(){ const h=(location.hash||"").slice(1); const d=depthOf(h); app.dataset.dir = d>=lastDepth ? "fwd" : "back"; lastDepth=d;
  if(T[h]) toolView(h); else { current=null; dock.hidden=true; if(io) io.disconnect(); if(h.startsWith("s-")) situation(h.slice(2)); else home(); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
(function splash(){ let seen=false; try{ seen=sessionStorage.getItem("mlr-splash")==="1"; }catch(e){} if(seen||location.hash.length>1) return;
  const el=document.createElement("div"); el.id="splash"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label","Velkommen til Martins lommerådgiver");
  const title="Martins lommerådgiver";
  el.innerHTML=`<div class="sp-bg" aria-hidden="true"><i></i><i></i><i></i></div>
   <svg class="sp-line" viewBox="0 0 320 120" preserveAspectRatio="none" aria-hidden="true"><path d="M-4 104 C 38 98, 58 72, 96 76 S 150 44, 186 50 S 248 16, 300 18"/><circle cx="300" cy="18" r="6"/></svg>
   <img class="sp-av" src="${MARTIN_IMG}" alt="" width="132" height="132">
   <h1 class="sp-t" aria-label="${title}">${(()=>{ let i=0; return title.split(" ").map(w=>`<span class="sp-w" aria-hidden="true">${w.split("").map(c=>`<span style="--i:${i++}">${c}</span>`).join("")}</span>`).join(" "); })()}</h1>
   <p class="sp-s">Svar på dine pengespørgsmål i almindeligt dansk. Med dine egne tal.</p>
   <button type="button" class="sp-go">Kom i gang</button>
   <p class="sp-note">Satser for 2026 · Dine svar bliver på din telefon</p>`;
  document.body.appendChild(el); document.body.classList.add("sp-open");
  const close=()=>{ if(el.classList.contains("out")) return; el.classList.add("out"); try{ sessionStorage.setItem("mlr-splash","1"); }catch(e){}
    setTimeout(()=>{ el.remove(); document.body.classList.remove("sp-open"); },480); };
  el.querySelector(".sp-go").onclick=close;
  el.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  setTimeout(()=>{ try{ el.querySelector(".sp-go").focus({preventScroll:true}); }catch(e){} },60);
})();
</script>
