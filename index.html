<style>
/* Layout: én kolonne som en app på telefonen. Forside → situation → spørgsmål med Martins svar. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E8EEE9; --ink:#172B29; --muted:#536762; --line:#D7E0DA;
  --accent:#145C50; --accent-2:#0B4A3F; --on-accent:#FFFFFF; --gold:#80530A; --gold-soft:#FBF0D9;
  --good:#1D7748; --good-soft:#E1F2E8; --warn:#9A5B00; --warn-soft:#FBEFD8; --bad:#AF3329; --bad-soft:#F9E3E0;
  --bar-1:#145C50; --bar-2:#895A12; --bar-3:#536F66; --bar-4:#AF3329;
  --shadow:0 1px 2px rgba(16,36,31,.06),0 6px 20px rgba(16,36,31,.06);
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-display:var(--f-body);
  --digits:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101A17; --surface:#172420; --sunk:#0F1A17; --ink:#EAF2EF; --muted:#A8BCB4; --line:#25342F;
  --accent:#78D1B2; --accent-2:#7AD6BC; --on-accent:#05231B; --gold:#E8B24C; --gold-soft:#2E2512;
  --good:#5BC98F; --good-soft:#132B1F; --warn:#E8B04E; --warn-soft:#2F2412; --bad:#EE8277; --bad-soft:#331816;
  --bar-1:#78D1B2; --bar-2:#E8B24C; --bar-3:#6E8780; --bar-4:#EE8277;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101A17; --surface:#172420; --sunk:#0F1A17; --ink:#EAF2EF; --muted:#A8BCB4; --line:#25342F;
  --accent:#78D1B2; --accent-2:#7AD6BC; --on-accent:#05231B; --gold:#E8B24C; --gold-soft:#2E2512;
  --good:#5BC98F; --good-soft:#132B1F; --warn:#E8B04E; --warn-soft:#2F2412; --bad:#EE8277; --bad-soft:#331816;
  --bar-1:#78D1B2; --bar-2:#E8B24C; --bar-3:#6E8780; --bar-4:#EE8277;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* Top */
.brand{display:flex;align-items:center;gap:12px}
.mono{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:22px;flex:none;position:relative}
.mono::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.brand-t{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1}
.brand-s{font-size:13px;color:var(--muted)}
.hello{margin-top:28px}
.hello h1{font-size:clamp(30px,8.5vw,40px);line-height:1.05;font-weight:800}
.hello h1 em{font-style:normal;color:var(--accent)}
.hello p{margin-top:12px;color:var(--muted);max-width:44ch}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:32px 0 12px}

/* Situationer */
.sit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:118px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.sit:active{transform:scale(.98)}
.sit:hover{border-color:var(--accent)}
.sit svg{width:28px;height:28px;color:var(--accent)}
.sit b{font-family:var(--f-display);font-size:17px;line-height:1.15}
.sit span{font-size:13px;color:var(--muted);line-height:1.35}
.sit.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

/* Spørgsmålsliste */
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.q:hover{border-color:var(--accent)}
.q .ic{width:38px;height:38px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--accent)}
.q .ic svg{width:22px;height:22px}
.q .qt{flex:1;min-width:0}
.q .qt b{display:block;font-weight:600;line-height:1.3}
.q .qt span{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.q .ar{color:var(--muted);flex:none}
.grp{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px}

/* Topbar på undersider */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px;cursor:pointer;font-weight:600;font-size:14px}
.bar .sp{flex:1}
.icon-btn{min-height:44px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.sit-head h2{font-size:30px;line-height:1.08;font-weight:800}
.sit-head p{color:var(--muted);margin-top:10px}
.quote{display:flex;gap:12px;align-items:flex-start;margin:18px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.quote .mono{width:34px;height:34px;font-size:17px}
.quote .mono::after{width:9px;height:9px}
.quote p{font-size:15px}

/* Værktøj */
.tool-h{font-size:clamp(26px,7.4vw,32px);line-height:1.08;font-weight:800}
.tool-intro{color:var(--muted);margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.inputs{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.field label,.field .lab{font-weight:600;font-size:15px;line-height:1.3}
.frow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px}
.frow>label,.frow>.lab{flex:1 1 150px;min-width:0}
.val{margin-left:auto}
.val{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:12px;padding:0 12px;flex:none;min-height:44px;cursor:text;border:1px solid transparent}
.val input{border:0;background:transparent;color:var(--ink);font:600 16px var(--f-body);width:8.5ch;text-align:right;font-variant-numeric:tabular-nums;padding:0;min-height:42px}
.val input:focus{outline:none}
.val:focus-within{box-shadow:0 0 0 2px var(--accent)}
.val small{color:var(--muted);font-size:13px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
input[type=range]{width:100%;margin:4px 0 0;-webkit-appearance:none;appearance:none;height:36px;background:transparent;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25);margin-top:-11px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 10px;cursor:pointer;font-size:14.5px;font-weight:600;min-width:64px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.answer{margin-top:26px;scroll-margin-top:16px}
.ans-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ans-top .mono{width:36px;height:36px;font-size:18px}
.ans-top .mono::after{width:9px;height:9px}
.ans-who{font-weight:700;line-height:1.2}
.ans-who small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;margin-bottom:10px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.t-good{color:var(--good);background:var(--good-soft)}
.t-obs{color:var(--warn);background:var(--warn-soft)}
.t-stop{color:var(--bad);background:var(--bad-soft)}
.t-info{color:var(--accent);background:var(--sunk)}
.ans-head{font-family:var(--f-display);font-size:23px;line-height:1.18;font-weight:700;text-wrap:balance}
.ans-body{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.ans-body p{max-width:62ch}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.stat.wide{grid-column:1/-1}
.chart{margin-top:16px}
.chart h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbl{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.hbl b{font-variant-numeric:tabular-nums}
.hbt{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:4px}
.hbf{height:100%;border-radius:6px;background:var(--bar-1);transition:width .16s ease}
.c2{background:var(--bar-2)}.c3{background:var(--bar-3)}.c4{background:var(--bar-4)}
svg.line{width:100%;height:auto;display:block}
svg.line text{fill:var(--muted);font:11px var(--f-body)}
svg.line .grid{stroke:var(--line);stroke-width:1}
.s1{stroke:var(--bar-1)}.s2{stroke:var(--bar-2)}.s3{stroke:var(--bar-3)}.s4{stroke:var(--bar-4)}
.f1{fill:var(--bar-1)}.f2{fill:var(--bar-2)}.f3{fill:var(--bar-3)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.rule{margin-top:16px;border-radius:14px;padding:12px 14px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.rule b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.rule p{font-size:15px}
.fine{font-size:12.5px;color:var(--muted);margin-top:14px}

/* Fast bundbjælke med kort svar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock button{max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;background:var(--dock-bg);color:var(--dock-fg);border:0;border-radius:16px;padding:10px 14px;cursor:pointer;text-align:left;min-height:56px}
.dock .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--on-accent)}
.dock .dt{flex:1;min-width:0;line-height:1.25}
.dock .dt small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.dock .dt span{display:block;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dock .dot{width:12px;height:12px}
.dock.pulse .dt span{animation:pulse .16s ease}
@keyframes pulse{0%{opacity:.4}100%{opacity:1}}
.dock .dg{font-size:13px;opacity:.85;flex:none}

/* Fod */
details.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
details.box summary{cursor:pointer;font-weight:600}
details.box .in{margin-top:12px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
details.box table{width:100%;border-collapse:collapse;font-size:13px}
details.box td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
details.box td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);padding-left:10px}
.disc{font-size:13px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){.sit-grid{grid-template-columns:1fr 1fr 1fr}}
:root{--dock-bg:#172B29;--dock-fg:#F3F6F5;--d-good:#5BD08F;--d-obs:#F2B84B;--d-stop:#F28B80;--d-info:#8FD3BF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dock-bg:#243A33}}
:root[data-theme="dark"]{--dock-bg:#243A33}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none;background:var(--surface)}
.step button{width:44px;height:44px;border:0;background:var(--sunk);font-size:22px;line-height:1;font-weight:600;cursor:pointer;color:var(--accent)}
.step button:disabled{opacity:.35;cursor:default}
.step output{min-width:42px;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.fhead{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--accent);padding-top:14px;border-top:1px solid var(--line)}
.fhead:first-child{border-top:0;padding-top:0}
.example{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-soft);border-radius:12px;padding:8px 8px 8px 12px;font-size:14px;margin-bottom:14px;line-height:1.35}
.example button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:40px;font-weight:600;font-size:13.5px;cursor:pointer;flex:none}
.gloss{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
.gloss summary{cursor:pointer;font-weight:600;font-size:14.5px;color:var(--accent);min-height:44px;display:flex;align-items:center}
.gloss dl{margin:0 0 4px;font-size:14px}
.gloss dt{font-weight:700;margin-top:10px}
.gloss dd{margin:2px 0 0;color:var(--muted)}
.cont{display:flex;align-items:center;gap:12px;margin-top:20px;background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:12px 14px;width:100%;text-align:left;cursor:pointer;min-height:56px}
.cont small{display:block;opacity:.8;font-size:12.5px}
.cont b{display:block;font-weight:700}
.cont span{flex:1;min-width:0}
.home-btn{width:44px;height:44px;padding:0;justify-content:center}
.home-btn svg{width:22px;height:22px;color:var(--accent)}
.restart{display:flex;justify-content:center;margin-top:10px}
.restart button{background:transparent;border:1px solid var(--line);border-radius:999px;min-height:44px;padding:0 18px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.restart button.arm{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.homelink{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-weight:600;cursor:pointer}
.homelink svg{width:20px;height:20px;color:var(--accent)}

/* Rolige flader, tydelige tal og betjening med én hånd. */
:root { --control:#7B8985; --shadow:none; }
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) { --control:#6D867B; --shadow:none; }
}
:root[data-theme="dark"] { --control:#6D867B; --shadow:none; }
body { font-variant-numeric:tabular-nums; }
.mono::after { display:none; }
.brand { padding-bottom:16px; border-bottom:1px solid var(--line); }
.hello h1 { max-width:18ch; letter-spacing:-.04em; }
.hello p,.ans-body p { line-height:1.6; }
.sit-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
.sit { border-radius:10px; gap:9px; padding:13px; }
.qlist { gap:0; border-top:1px solid var(--line); }
.q { background:transparent; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:14px 0; }
.quote,.rule { background:var(--sunk); border:0; border-left:3px solid var(--accent); border-radius:0 8px 8px 0; }
.rule b { color:var(--accent); }
.sit span,.q .qt span,.quote p,.rule p,.hint,.gloss dl,.fine,.disc,.example,
details.box .in,details.box table,.field label,.field .lab,.gloss summary { font-size:16px; }
.card { border-radius:12px; }
.inputs { gap:22px; }
.field:has(.val) .frow { display:grid; gap:7px; }
.val { margin:0; justify-content:space-between; border-color:var(--control); border-radius:7px; background:var(--surface); }

// Nærmeste lånetype hos et institut, hvis den valgte ikke findes dér
function nearest(inst,type){ const P=INST[inst].p; if(P[type]) return type;
  return ORDER.filter(t=>P[t]).sort((a,b)=>Math.abs(LT[a].bind-LT[type].bind)-Math.abs(LT[b].bind-LT[type].bind))[0]; }
function netBid(inst,type){ const x=INST[inst].p[type]; return x&&x.b!=null? x.b-INST[inst].kk : null; }
function bidrag(ltvPct, variabel){ // vægtet bidragssats i % af lånet (typiske satser, skøn)
  const tr=[[40,0.30],[60,0.65],[80,1.05]]; let prev=0,sum=0; const L=Math.min(80,Math.max(0,ltvPct));
  for(const [t,s] of tr){ const part=Math.max(0,Math.min(L,t)-prev); sum+=part*s; prev=t; }
  const add = variabel===true ? LT.fkort.add : (typeof variabel==="string" && LT[variabel] ? LT[variabel].add : 0);
  return (L>0? sum/L : 0.30) + add;
}

function hbars(items){
  const max=Math.max(...items.map(i=>Math.abs(i.v)),1);
  return '<div class="hbars">'+items.map(i=>`<div><div class="hbl"><span>${esc(i.l)}</span><b>${i.t||kr(i.v)}</b></div><div class="hbt"><div class="hbf ${i.c||""}" style="width:${Math.max(1.5,Math.abs(i.v)/max*100)}%"></div></div></div>`).join("")+"</div>";
}
function lines(series, xs, xlab){
  const W=320,H=170,L=46,Rr=8,T=10,B=24; const all=series.flatMap(s=>s.d);
  let mn=Math.min(0,...all), mx=Math.max(...all,1); if(mx===mn) mx=mn+1;
  const X=i=>L+(W-L-Rr)*i/Math.max(1,xs.length-1), Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g=""; for(let k=0;k<=3;k++){ const v=mn+(mx-mn)*k/3; g+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${kort(v)}</text>`; }
  const step=Math.max(1,Math.ceil(xs.length/6)); let xl="";
  xs.forEach((x,i)=>{ if(i%step===0||i===xs.length-1) xl+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${x}</text>`; });
  const paths=series.map((s,si)=>{ const d=s.d.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    const last=s.d.length-1; return `<path d="${d}" fill="none" class="s${si+1}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(last)}" cy="${Y(s.d[last])}" r="4" class="f${si+1}"/>`; }).join("");
  const leg='<div class="legend">'+series.map((s,si)=>`<span><i class="c${si+1}" style="background:var(--bar-${si+1})"></i>${esc(s.n)}</span>`).join("")+(xlab?`<span>Vandret: ${esc(xlab)}</span>`:"")+"</div>";
  return `<svg class="line" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf">${g}${xl}${paths}</svg>${leg}`;
}

/* ============ Værktøjer ============ */
const T = {};
function tool(o){ T[o.id]=o; }
const tone = { good:["t-good","Det ser fornuftigt ud"], obs:["t-obs","Vær opmærksom"], stop:["t-stop","Det ser svært ud"], info:["t-info","Sådan ser det ud"] };

/* 0. Budget */
function budgetTal(){ const netto=(skat(S.loen1*12,S.pens).netto+(S.voksne==2?skat(S.loen2*12,S.pens).netto:0))/12;
  const b=S.boern>0?S.boernUdg:0, udg=S.boligUdg+S.transport+S.fasteUdg+b+S.gaeldMd+S.mad;
  return {netto,udg,boern:b,tilbage:netto-udg}; }
tool({id:"budget",ord:["Rådighedsbeløb"],grp:"Budget",ic:"budget",q:"Hvor meget har jeg tilbage hver måned?",sub:"Dit budget: hvad der kommer ind, hvad der går ud, og hvad der er tilbage",
 intro:"Overblik er første skridt. Jeg spørger til det, der kommer ind, og jeres faste udgifter. Bagefter kan du se, hvad der er tilbage, og hvad jeg vil anbefale.",
 f:["#Jer","voksne","loen1","loen2","boern","#Faste udgifter om måneden","boligUdg","transport","fasteUdg","boernUdg","gaeldMd","mad"],
 calc(){ const x=budgetTal(), opsp=x.netto*0.1, andel=v=>v/Math.max(1,x.netto);
  let t= x.tilbage<0?"stop": x.tilbage<x.netto*0.15?"obs":"good";
  const head = t==="stop"? `Udgifterne er ca. ${kr(-x.tilbage)} større end det, I får udbetalt, hver måned. Det skal der gøres noget ved.`
    : t==="obs"? `Der er ca. ${kr(x.tilbage)} tilbage om måneden. Det er stramt, når tøj, gaver, ferie og uforudsete ting også skal betales.`
    : `Der er ca. ${kr(x.tilbage)} tilbage om måneden efter faste udgifter og mad. Det giver plads til både fornøjelser og opsparing.`;
  let body=`<p>I får ca. ${kr(x.netto)} udbetalt om måneden, og de faste udgifter og mad er ca. ${kr(x.udg)}. Det, der er tilbage, skal dække tøj, gaver, ferie, fritid og alt det uforudsete.</p>`;
  if(t!=="stop") body+=`<p>Prøv at sætte omkring 10 % af det, I får udbetalt, til side. Det er ca. ${kr(opsp)} om måneden. Kan I ikke det endnu, så start med et mindre beløb. Det vigtigste er, at det sker hver måned.</p>`;
  if(andel(S.boligUdg)>0.4) body+=`<p>Boligen tager ${pct(andel(S.boligUdg)*100,0)} af det, I får udbetalt. Det er højt. En almindelig tommelfingerregel er, at boligen helst ikke bør tage meget mere end en tredjedel.</p>`;
  if(andel(S.gaeldMd)>0.1) body+=`<p>Afdrag på gæld tager ${pct(andel(S.gaeldMd)*100,0)} af det, I får udbetalt. Se spørgsmålet "Hvilken gæld skal jeg betale af først?" for at få en plan.</p>`;
  if(andel(S.transport)>0.15) body+=`<p>Transport fylder ${pct(andel(S.transport)*100,0)} af budgettet. Bilen er ofte den post, hvor der er mest at hente.</p>`;
  body+=`<p>Gå forsikringer og abonnementer igennem én gang om året. Det er ofte de nemmeste penge at spare.</p>`;
  if(t==="stop") body+=`<p>Find de største poster, I kan ændre, og tag dem først. Er gælden blevet uoverskuelig, kan I få gratis og anonym gældsrådgivning hos Forbrugerrådet Tænk.</p>`;
  const lead=t==="good"?"Ser fornuftigt ud":t==="obs"?"Stramt":"Ser svært ud";
  return {tone:t,head,short:`${lead} · ca. ${kr(x.tilbage)} tilbage om måneden`,body,
   stats:[["Udbetalt om måneden",kr(x.netto)],["Faste udgifter og mad",kr(x.udg)],["Tilbage om måneden",kr(x.tilbage)],["Forslag til opsparing (10 %)",kr(opsp)]],
   chart:{h:"Hvor pengene går hen hver måned",html:hbars([{l:"Bolig",v:S.boligUdg},{l:"Mad og dagligvarer",v:S.mad,c:"c3"},{l:"Transport",v:S.transport,c:"c3"},{l:"Forsikringer og abonnementer",v:S.fasteUdg,c:"c3"}].concat(x.boern?[{l:"Børn",v:x.boern,c:"c3"}]:[]).concat(S.gaeldMd?[{l:"Gæld",v:S.gaeldMd,c:"c4"}]:[]).concat([{l:"Tilbage",v:Math.max(0,x.tilbage),c:"c2"}]))},
   rule:"Betal dig selv først. Flyt opsparingen den dag, lønnen kommer, og lev for resten. Så bliver der ikke kun sparet op, når der er noget tilovers.",
   fine:"Børne- og ungeydelse, boligstøtte og andre tilskud er ikke med. Skatten er beregnet med landsgennemsnitlig kommuneskat og din pensionsindbetaling. Tallet for mad er dit eget eller mit skøn."};
 }});

/* 1. Løn */
tool({id:"loen",ord:["Marginalskat","AM-bidrag","Mellemskat"],grp:"Løn og skat",ic:"loen",q:"Hvad får jeg udbetalt?",sub:"Din løn efter skat og pension med reglerne for 2026",
 intro:"Der kom en ny mellemskat og en lavere topskat i 2026, så mange har fået lidt mere udbetalt. Her kan du se, hvad du selv beholder.",
 f:["loen1","pens"],
 calc(){ const a=S.loen1*12, t=skat(a,S.pens), m=marginal(a,S.pens), md=t.netto/12;
  const skatPct = (t.am+t.kommune+t.stat)/Math.max(1,t.ai);
  let body=`<p>Af din løn på ${kr(S.loen1)} går ${kr(t.pens/12)} til din pension, ${kr(t.am/12)} til arbejdsmarkedsbidrag og ${kr((t.kommune+t.stat)/12)} i skat. Resten er dit.</p>`;
  if(t.pi>R.mellemGr) body+=`<p>Du tjener nok til at betale mellemskat${t.pi>R.topGr?" og topskat":""}. Det betyder, at penge, du sætter ind på en ratepension gennem din arbejdsgiver, sparer dig for skat med din høje sats. Det kan være en rigtig god idé, men pengene er bundet til du går på pension, så tænk over, om du har brug for dem før.</p>`;
  else body+=`<p>Du betaler ikke mellemskat. Den kommer først, når din løn efter AM-bidrag og pension kommer over ca. ${krx(R.mellemGr)} om året.</p>`;
  return {tone:"info", head:`Du får ca. <span class="num">${kr(md)}</span> udbetalt om måneden.`, short:`Ca. ${kr(md)} udbetalt om måneden`, body,
   stats:[["Udbetalt om året",kr(t.netto)],["Skat inkl. AM-bidrag",pct(skatPct*100)],["Af næste 1.000 kr. beholder du",kr(1000*(1-m))],["Skat af de næste kroner (marginalskat)",pct(m*100)]],
   chart:{h:"Hvor din månedsløn går hen",html:hbars([{l:"Til dig",v:md},{l:"Kommune- og kirkeskat",v:t.kommune/12,c:"c3"},{l:"Statsskat",v:t.stat/12,c:"c3"},{l:"AM-bidrag",v:t.am/12,c:"c3"},{l:"Din pension",v:t.pens/12,c:"c2"}])},
   rule:"Se på, hvor meget du beholder af de næste 1.000 kr., du tjener. Det tal afgør, hvor meget overarbejde, pension og fradrag er værd for dig.",
   fine:"Beregnet med landsgennemsnitlig kommuneskat, som du kan ændre på forsiden. Jobfradrag, skatteloft og særlige fradrag som befordring er ikke med, så tallet kan afvige med et par hundrede kroner. Se din forskudsopgørelse for det præcise tal."};
 }});

/* 2. Bolig */
// Løbende udgifter: skøn ud fra typiske tal (Bolius m.fl.). Brugeren kan altid skrive sit eget tal.
function driftEst(){
  const m2=S.m2, age=Math.max(0,thisYear-S.byggeaar), hus=S.type==="hus";
  const alder = age>65?1.25: age>45?1.1: age>20?1.0: 0.8;
  const rate={fjern:125,pumpe:70,gas:145,olie:300,el:220,fv:140}[S.varme]||140;
  const varme=m2*rate*alder*(hus?1:0.8);
  const vedl= hus ? m2*(age>60?220: age>30?170: age>10?120:60) : m2*40;
  const fast = hus ? 17000 : 5000;
  const faelles = hus?0: m2*25*12;
  const parts=[["Varme",varme/12],["Vedligehold",vedl/12],[hus?"Forsikring, vand og renovation":"Vand",fast/12]].concat(hus?[]:[["Fællesudgifter til ejerforeningen",faelles/12]]);
  return {total:(varme+vedl+fast+faelles)/12, parts, vedl:vedl/12};
}
function driftMd(){ return S.driftValg==="egen"? S.drift : driftEst().total; }
function bolig(pris, tillaeg){
  tillaeg=tillaeg||0;
  const omk = pris*0.006 + 1850 + 30000;            // skøde + gebyrer, advokat/rådgivning
  let udbet=Math.max(0,S.opsparing-omk);
  let realk=Math.min(pris*0.8,Math.max(0,pris-udbet));
  let bank=Math.max(0,pris-udbet-realk);
  const pant=(realk+bank)*0.0145+1825*(bank>0?2:1);  // tinglysning af pant for realkredit og bank
  udbet=Math.max(0,S.opsparing-omk-pant);
  realk=Math.min(pris*0.8,Math.max(0,pris-udbet));
  bank=Math.max(0,pris-udbet-realk);
  const lt=LT[S.laantype]?S.laantype:"fast", rr=rateFor(lt)+tillaeg;
  const ltv=realk/pris; let bidPct=bidrag(ltv*100,lt);
  if(INST[S.inst]){ const nb=netBid(S.inst,nearest(S.inst,lt)); if(nb!=null) bidPct=nb*bidrag(ltv*100,lt)/bidrag(80,lt); }
  const bid=bidPct/100;
  const a1=amort(realk,rr,30,12), b1=amort(bank,R.bankRente+tillaeg,20,12);
  const bidr=realk*bid, renter=a1.renter+b1.renter+bidr, frad=renter*fradragPct(renter);
  const grundlag=pris*0.8, evs=Math.min(grundlag,R.evsGr)*R.evs+Math.max(0,grundlag-R.evsGr)*R.evsHoj;
  const grund=pris*(S.type==="hus"?0.35:0.10)*0.8*R.grundPromille;
  const ydelse=(a1.ydelse*12+bidr+b1.ydelse*12)/12, drift=driftMd();
  const boligMd=ydelse+(evs+grund)/12+drift-frad/12;
  const nettoMd=(skat(S.loen1*12,S.pens).netto+(S.voksne==2?skat(S.loen2*12,S.pens).netto:0))/12;
  const raad=nettoMd-boligMd-S.andre, brutto=12*(S.loen1+(S.voksne==2?S.loen2:0));
  return {pris,omk:omk+pant,udbet,realk,bank,rr,ltv,ydelse,frad:frad/12,skatter:(evs+grund)/12,drift,boligMd,nettoMd,raad,
    gf:(realk+bank+(S.andenGaeld||0))/Math.max(1,brutto),udbetOk:udbet>=pris*0.05,brutto};
}
// Der findes ingen fast grænse. Tallet er et forsigtigt pejlemærke (fx 12–15.000 kr. for to voksne og to børn).
function krav(){ return (S.voksne==2?10000:6500)+3000*S.boern; }
function husNoter(){
  const n=[], aar=S.byggeaar, age=thisYear-aar, hus=S.type==="hus";
  if(hus){
    if(aar<1950) n.push(`Huset er fra ${aar}. I så gamle huse bør I især tjekke kloak, fundament, fugt i kælderen og el-installationerne. Bed om en kloakrapport, hvor rørene bliver filmet.`);
    if(aar>=1950&&aar<=1977) n.push(`Huse fra 1950–1977 kan have PCB i fuger, maling og termoruder. Det kan ikke ses, så skal I renovere, bør det undersøges af fagfolk først.`);
    if(aar<1988) n.push(`Har huset et tag af eternit (bølgeplader) fra før midten af 1980'erne, indeholder det næsten altid asbest. Et nyt tag bliver dyrere, fordi asbest skal fjernes forsvarligt.`);
    if(aar>=1960&&aar<=1985) n.push(`Huse fra 1960'erne og 70'erne er ofte dårligt isoleret. Regn med en højere varmeregning, og spørg til tag, vinduer og efterisolering.`);
    if(age>=25&&age<=60) n.push(`Tag, vinduer og varmeanlæg holder typisk 25–40 år. Spørg, hvornår de sidst er skiftet. Er de originale, så sæt penge af til at skifte dem i de kommende år.`);
    if(age<10) n.push(`Huset er nyt, så vedligeholdelsen er lav de første år. Tjek, at der ikke er åbne mangler fra byggeriet.`);
  } else {
    n.push(`Læs ejerforeningens referater, budget og vedligeholdelsesplan. Er der planlagt et nyt tag, ny facade eller nye vinduer, kan fællesudgifterne stige eller ende som en ekstra regning.`);
    if(aar>=1950&&aar<=1977) n.push(`Ejendomme fra 1950–1977 kan have PCB i fuger og termoruder. Spørg, om foreningen har fået det undersøgt.`);
  }
  const v={olie:`Oliefyr er den dyreste måde at varme et hus op på. Regn med, at det skal skiftes til fx en varmepumpe, og at det koster et større beløb. Undersøg, om der er tilskud.`,
    gas:`Gas skal udfases i mange områder. Undersøg, om der kommer fjernvarme, eller om I skal regne med en varmepumpe inden for nogle år.`,
    el:`Opvarmning med elradiatorer er dyr. Undersøg, om der kan sættes en varmepumpe op.`,
    pumpe:`En varmepumpe er billig i drift, men holder typisk 15–20 år. Spørg, hvor gammel den er.`,
    fv:`Find ud af, hvordan boligen bliver varmet op. Forskellen mellem den billigste og den dyreste løsning kan være flere tusind kroner om måneden.`}[S.varme];
  if(v) n.push(v);
  if(hus) n.push(`Få en tilstandsrapport og en elinstallationsrapport, og overvej ejerskifteforsikringen. ${aar<1980?"Til et hus fra før 1980 bør I også overveje en kloakrapport.":""}`.trim());
  return n;
}
tool({id:"bolig",ord:["Rådighedsbeløb","Gældsfaktor","Belåningsgrad","F-kort","Bidragssats"],grp:"Bolig",ic:"hus",q:"Har vi råd til boligen?",sub:"Hvad boligen koster om måneden, hvad I har tilbage at leve for, og hvad I skal være opmærksomme på",
 intro:"Det vigtigste er ikke prisen, men hvad I har tilbage at leve for, når boligen er betalt. Jeg spørger ind til jer, boligen og jeres faste udgifter.",
 f:["#Jer","voksne","loen1","loen2","boern","andenGaeld","#Boligen","pris","type","m2","byggeaar","varme","opsparing","laantype","inst","#Faste udgifter","driftValg","drift","andre"],
 calc(){ const b=bolig(S.pris), k=krav(), st=bolig(S.pris,2), d=driftEst();
  let lo=200000,hi=30000000; const ok=p=>{const x=bolig(p); return x.udbetOk&&x.gf<=4&&x.raad>=k;};
  let maxP=0; if(ok(lo)){ for(let i=0;i<40;i++){ const m=(lo+hi)/2; if(ok(m)) lo=m; else hi=m; } maxP=lo; }
  let binder="";
  if(maxP){ const t=bolig(maxP*1.01); binder = !t.udbetOk?"jeres opsparing, fordi I skal betale mindst 5 % af prisen selv": t.gf>4?"jeres samlede gæld. Den bør helst ikke være over 4 gange jeres samlede årsindkomst før skat":"det, I har tilbage at leve for hver måned"; }
  const margin=b.raad-k, red=b.gf>4&&b.ltv>0.6;
  let t;
  if(!b.udbetOk||b.raad<k-2000||b.gf>5) t="stop"; else if(b.raad<k+2000||b.gf>4) t="obs"; else t="good";
  let head;
  const mangler=Math.max(0,S.pris*0.05-b.udbet);
  if(!b.udbetOk && mangler<S.pris*0.01 && b.raad>=k-2000) { t="obs"; head=`Det er tæt på. I mangler ca. ${kr(mangler)} til udbetalingen, når udgifterne ved købet er betalt. Ellers ser det ud til at kunne hænge sammen.`; }
  else if(!b.udbetOk) head=`I mangler ca. ${kr(mangler)} til udbetalingen. I skal selv betale mindst 5 % af prisen, når udgifterne ved købet er betalt.${b.raad<k-2000?" Og selv med udbetalingen på plads ville I have for lidt tilbage at leve for om måneden.":""}`;
  else if(t==="good") head=`Det ser ud til, at I kan bære boligen. I har ca. ${kr(b.raad)} tilbage at leve for om måneden, når boligen er betalt.`;
  else if(t==="obs") head=`Det er på grænsen. I har ca. ${kr(b.raad)} tilbage at leve for om måneden, og det er tæt på det, banker typisk vil se.`;
  else head=`Som tallene ser ud nu, bliver det svært. I har ca. ${kr(b.raad)} tilbage at leve for om måneden, og det er mindre, end banker typisk vil se.`;
  let body=`<p>Boligen koster jer ca. ${kr(b.boligMd)} om måneden, når skattefradraget for renterne er trukket fra. Det dækker lån, ejendomsskat og løbende udgifter. ${S.driftValg==="egen"?"De løbende udgifter er jeres eget tal.":`De løbende udgifter har jeg skønnet til ca. ${kr(d.total)} om måneden ud fra boligens størrelse, alder og opvarmning.`}</p>`;
  body+=`<p>Der findes ingen fast grænse for, hvad man skal have tilbage. Hver bank vurderer selv. Et forsigtigt pejlemærke for en husstand som jeres er ca. ${kr(k)} om måneden til mad, tøj, fritid og uforudsete ting. ${t==="obs"?"I ligger tæt på, så det kan gå begge veje. Det afgør typisk, hvordan jeres økonomi har set ud de seneste år, og hvor meget I har sparet op.":""}</p>`;
  body+= maxP? `<p>Mit forsigtige bud på jeres maksimale pris er ca. <b>${kr(maxP)}</b>. Det, der sætter grænsen, er ${binder}. Nogle banker vil låne jer mere, men så bliver der mindre luft i budgettet.</p>`:`<p>Med jeres nuværende tal kan jeg ikke finde en pris, der holder. Start med at spare mere op eller få de faste udgifter ned.</p>`;
  if(b.gf>4) body+=`<p>Jeres samlede gæld bliver ca. ${nf(b.gf,1)} gange jeres årsindkomst før skat. Over 4 kigger banken ekstra grundigt på jeres økonomi${red?`, og når I samtidig låner over 60 % af boligens værdi, må I som udgangspunkt ikke få lån, hvor renten ligger fast i under 5 år (F1, F3 og F-kort), eller lån uden afdrag${["f1","f3","fkort"].includes(S.laantype)?". Regn med F5 eller fast rente i stedet":""}`:""}.</p>`;
  if(S.laantype!=="fast") body+=`<p>I har valgt ${LT[S.laantype].n}, hvor renten kan ændre sig ${S.laantype==="fkort"?"hvert halve år":S.laantype==="f1"?"hvert år":"hvert "+(LT[S.laantype].bind/12)+". år"}. Stiger renten 2 procentpoint, har I ca. ${kr(st.raad)} tilbage om måneden. Prøv det under "Hvad nu hvis".</p>`;
  const notes=husNoter(); const compare=instCompare();
  if(S.type==="hus") notes.unshift(`Sæt penge af til vedligehold hver måned, også når intet er i stykker. For et hus som jeres har jeg regnet med ca. ${kr(d.vedl)} om måneden. Det svarer til ${kr(d.vedl*12)} om året.`);
  const lead = t==="good"?"Ser fornuftigt ud":t==="obs"?"På grænsen":"Ser svært ud";
  return {tone:t,head,notes,compare,short:maxP?`${lead} · forsigtigt maks. ca. ${kr(maxP)}`:`${lead} · ingen pris holder endnu`,body,
   stats:[["Boligen om måneden efter fradrag",kr(b.boligMd)],["Tilbage at leve for",kr(b.raad),`Pejlemærke ca. ${kr(k)}`],["Gæld i forhold til årsindkomst",nf(b.gf,1).replace(".",",")+" gange","Over 4 gange er højt"],["Lånt af boligens værdi",pct((b.realk+b.bank)/S.pris*100,0)],["Lån i realkredit",kr(b.realk)],["Lån i banken",kr(b.bank)],["Udgifter ved købet",kr(b.omk),"Skøde, pant, gebyrer, rådgivning"],["Forsigtigt bud på maks. pris",maxP?kr(maxP):"–"]],
   chart:{h:S.driftValg==="egen"?"Sådan bliver jeres udbetalte løn brugt":"Mit skøn over boligens løbende udgifter om måneden",html:S.driftValg==="egen"?hbars([{l:"Boligen efter fradrag",v:b.boligMd},{l:"Andre faste udgifter",v:S.andre,c:"c3"},{l:"Tilbage at leve for",v:Math.max(0,b.raad),c:b.raad>=k?"":"c4"}]):hbars(d.parts.map(([l,v])=>({l,v,c:l==="Vedligehold"?"c2":""})))},
   rule:"Køb ikke en bolig, hvor I kun lige klarer det. Hav gerne 2–3.000 kr. ekstra luft om måneden. Det er dem, der redder jer, når taget skal repareres, eller bilen går i stykker.",
   fine:`Renter pr. 17. november 2026: fast ${pct(R.fast)}, F5 ${pct(R.f5)}, F3 ${pct(R.f3)}, F1 ${pct(R.f1)}, F-kort ${pct(R.fkort)} og banklån ${pct(R.bankRente)} (skøn). Variable lån har et højere bidrag end fast rente. Fastforrentede lån optages ofte under kurs 100, så I skal låne lidt mere end prisen; det er ikke regnet med. Ejendomsværdiskat: 5,1 promille af 80 % af værdien. Grundskyld varierer meget mellem kommunerne og er et skøn. De løbende udgifter er skøn ud fra typiske tal og kan afvige meget fra jeres bolig.`};
 }});

/* 2b. Mødet med banken */
function instCompare(){
  const b=bolig(S.pris), lt=LT[S.laantype]?S.laantype:"fast", fr=fradragPct(b.realk*b.rr/100), sel=INST[S.inst]?S.inst:null;
  const rows=Object.keys(INST).map(id=>{ const t=nearest(id,lt), x=INST[id].p[t], nb=netBid(id,t);
    return {id,t,nm:x?x.nm:"–",nb,est:x&&x.est,only:x&&x.only,same:t===lt}; });
  const base= sel? rows.find(r=>r.id===sel).nb : Math.min(...rows.filter(r=>r.nb!=null&&r.same).map(r=>r.nb));
  rows.forEach(r=>{ r.md = (r.nb!=null&&base!=null&&isFinite(base)) ? b.realk*(r.nb-base)/100/12*(1-fr) : null; });
  return {rows,sel,lt,base,realk:b.realk};
}
function bankTal(){ const b=bolig(S.pris), foer=b.nettoMd-S.boligNu-S.andre; return {b,foer,efter:b.raad,ned:foer-b.raad}; }
tool({id:"bankmoede",ord:["Rådighedsbeløb","Gældsfaktor","Belåningsgrad","ÅOP på lån","Lånesagsgebyr","Kurtage","Kursskæring","Tinglysningsafgift","Efterfinansiering","Bidragssats","KundeKroner","Ejerpantebrev"],grp:"Bolig",ic:"bank",
 q:"Hvordan forbereder vi os til mødet med banken?",sub:"Nedgangen i rådighedsbeløbet, gebyrer, renten på banklånet og bankens fagudtryk",
 intro:"Banken ser især på, hvor meget jeres rådighedsbeløb falder, når I køber. Jeg hjælper jer med at forklare det, og med at forhandle gebyrer og rente.",
 f:["#Jer","voksne","loen1","loen2","boern","andenGaeld","#I dag","boligNu","andre","spar12","#Den nye bolig","pris","type","m2","byggeaar","varme","opsparing","laantype","inst","driftValg","drift"],
 calc(){ const x=bankTal(), k=krav(), b=x.b, ned=x.ned, laan=b.realk+b.bank, stift=Math.round(laan*0.01/1000)*1000;
  const bankSpar=b.bank*0.005*(1-fradragPct(b.bank*R.bankRente/100))/12;
  let t= x.efter<k-2000?"stop": (ned>0&&S.spar12<ned)||x.efter<k+2000?"obs":"good";
  const head= ned>0? `Jeres rådighedsbeløb falder med ca. ${kr(ned)} om måneden, fra ${kr(x.foer)} til ${kr(x.efter)}. Det er det, banken vil spørge mest ind til.`
                   : `Jeres rådighedsbeløb stiger faktisk med ca. ${kr(-ned)} om måneden. Det står godt til, men forbered jer alligevel på gebyrer og rente.`;
  let body=`<p>Privatrådgivere ser i dag især på forskellen mellem det, I har tilbage nu, og det, I vil have tilbage efter købet. Jo større fald, jo bedre skal I kunne forklare, hvordan I vil klare det.</p>`;
  if(ned>0 && S.spar12>=ned) body+=`<p>Det står godt til. I har sparet ca. ${kr(S.spar12)} op om måneden det seneste år, og det er mere end nedgangen. Tag kontoudtog med, så banken kan se det. Det er jeres stærkeste argument.</p>`;
  else if(ned>0) body+=`<p>I har sparet ${S.spar12?`ca. ${kr(S.spar12)}`:"ikke noget"} op om måneden, og det er mindre end nedgangen. Mit råd: Sæt ${kr(ned)} til side hver måned i 3–6 måneder før mødet, og lev for resten. Så kan I vise banken, at det holder.</p>`;
  if(x.efter<k+2000) body+=`<p>Efter købet har I ca. ${kr(x.efter)} tilbage at leve for. Det er tæt på eller under det, banker typisk vil se (ca. ${kr(k)}). Forvent, at banken vil se jeres budget i detaljer.</p>`;
  body+=`<p>Forklar konkret, hvad der ændrer sig. Hvilke udgifter forsvinder, når I flytter, fx husleje, transport eller dobbelt husførelse? Er der en lønstigning eller fastansættelse på vej? Og hvor stor er jeres buffer, når købet er gennemført?</p>`;
  body+=`<p>Det koster typisk omkring 1 % af lånet at oprette lånene. For jer er det i størrelsesordenen ${kr(stift)}. Tinglysningsafgiften er fastsat ved lov og kan ikke forhandles. Lånesagsgebyr, kurtage og kursskæring kan I forhandle. Bed om et samlet tilbud i kroner, og hent tilbud fra mindst to banker.</p>`;
  body+= b.bank>0? `<p>Banklånet oven på realkreditlånet, efterfinansieringen, er på ca. ${kr(b.bank)}. Det har typisk en højere rente end realkreditlånet, og renten kan forhandles. Bare 0,5 procentpoint lavere rente sparer jer ca. ${kr(bankSpar)} om måneden efter skat. Spørg også, om lånet kan indfries uden gebyr, og om renten falder, når gælden bliver mindre.</p>`
               : `<p>I har ikke brug for et banklån oven på realkreditlånet. Det gør jer til attraktive kunder, så brug det i forhandlingen.</p>`;
  body+=`<p>Sig det højt i mødet: "Vi har et tilbud fra en anden bank. Kan I matche det eller gøre det bedre på gebyrer og rente?" Det er helt normalt at forhandle, og banken forventer det.</p>`;
  const notes=["Lønsedler for de seneste 3 måneder og jeres seneste årsopgørelse fra Skat.",
    "Kontoudtog, der viser jeres opsparing de seneste måneder.",
    "Et budget for i dag og efter købet. Brug \"Hvor meget har jeg tilbage hver måned?\".",
    "En oversigt over al gæld: billån, SU-lån, kreditkort og forbrugslån.",
    "Salgsopstilling, tilstandsrapport, elinstallationsrapport og energimærke for boligen.",
    "Bed om renter, gebyrer og ÅOP for hele finansieringen på skrift, så I kan sammenligne bankerne."];
  const lead=t==="good"?"Godt forberedt":t==="obs"?"Forbered forklaringen":"Svært lige nu";
  return {tone:t,head,notes,compare:instCompare(),notesTitle:"Tag det med til mødet",notesLead:"Så kan banken se det hele med det samme.",short:`${lead} · fald på ca. ${kr(Math.max(0,ned))}/md.`,body,
   stats:[["Tilbage i dag",kr(x.foer)],["Tilbage efter købet",kr(x.efter),`Pejlemærke ca. ${kr(k)}`],["Nedgang om måneden",kr(Math.max(0,ned))],["Opsparet om måneden",kr(S.spar12)],["Oprettelse af lån (ca. 1 %)",kr(stift)],["Banklån (efterfinansiering)",kr(b.bank)]],
   rule:"Forhandl om alt det, der ikke står i loven. Banken forventer det, og det værste, der kan ske, er et nej.",
   fine:"Omkostningerne til at oprette lånene er et skøn på ca. 1 % af lånene og varierer mellem bankerne. Renten på banklånet er et skøn. Bed altid om et skriftligt tilbud med ÅOP og samlede omkostninger i kroner."};
 }});

/* 3. Fast eller variabel */
// Markedsrenten for hver type ændrer sig gradvist med "stig" over 3 år. Lånet låser renten ved hver rentetilpasning.
function laanSim(P,aar,type,r0,stig,mdr){
  const bind=LT[type].bind; let b=P,paid=0,rente=r0; const n=aar*12, series=[];
  for(let i=0;i<mdr;i++){
    if(bind && i>0 && i%bind===0) rente=r0+stig*Math.min(1,i/36);
    const left=n-i, r=rente/1200, y= r? b*r/(1-Math.pow(1+r,-left)) : b/left;
    const it=b*r, bid=b*bidrag(80,type)/1200, fr=(it+bid)*fradragPct((it+bid)*12);
    paid+=y+bid-fr; b-=Math.min(b,y-it); if(i%12===11) series.push(paid+b);
  }
  return {paid,rest:b,series};
}
function startRente(t){ return {fast:S.fastR,f5:S.f5R,f3:S.f3R,f1:S.f1R,fkort:S.fkortR}[t]; }
tool({id:"fastvar",ord:["F-kort","F1, F3 og F5","Konverteringsret","Bidragssats"],grp:"Bolig",ic:"rente",q:"Skal vi vælge fast eller variabel rente?",sub:"Fast rente, F5, F3, F1 og F-kort sammenlignet med dine tal",
 intro:"Jo kortere tid renten ligger fast, jo lavere er den typisk nu, men jo større er risikoen. Jeg sammenligner alle fem lånetyper over de næste 10 år med din forventning til renten.",
 f:["#Lånet","laan","laanetid","#Renterne","renteValg","fastR","f5R","f3R","f1R","fkortR","stig"],
 calc(){ const P=S.laan,n=S.laanetid, types=["fast","f5","f3","f1","fkort"];
  if(S.renteValg!=="egen"){ S.fastR=R.fast; S.f5R=R.f5; S.f3R=R.f3; S.f1R=R.f1; S.fkortR=R.fkort; }
  const res=types.map(t=>{ const r0=startRente(t), y=ann(P,r0,n)+P*bidrag(80,t)/1200, sim=laanSim(P,n,t,r0,S.stig,120); return {t,r0,y,cost:sim.paid+sim.rest,series:sim.series}; });
  const best=res.reduce((a,b)=>b.cost<a.cost?b:a), fast=res[0], spread=Math.max(...res.map(r=>r.cost))-Math.min(...res.map(r=>r.cost));
  let lo=-5,hi=12; for(let i=0;i<40;i++){ const m=(lo+hi)/2; const x=laanSim(P,n,"fkort",S.fkortR,m,120); (x.paid+x.rest<fast.cost)? lo=m : hi=m; } const be=lo;
  const t = spread<P*0.01 ? "info" : best.t==="fast" ? "good" : (be<1.5?"obs":"good");
  const head = spread<P*0.01? `Med din forventning til renten er der næsten ingen forskel mellem lånetyperne over 10 år. Valget handler mest om, hvor meget usikkerhed I kan leve med.`
    : best.t==="fast" ? `Hvis renten udvikler sig, som du forventer, bliver fast rente billigst over 10 år, ca. ${kr(Math.min(...res.slice(1).map(r=>r.cost))-fast.cost)} billigere end den næstbilligste.`
    : `Hvis renten udvikler sig, som du forventer, bliver ${LT[best.t].n} billigst over 10 år, ca. ${kr(fast.cost-best.cost)} billigere end fast rente.`;
  let body=`<p>I dag er ydelsen før skat ${kr(fast.y)} om måneden med fast rente og ${kr(res[4].y)} med F-kort. Imellem ligger F5 (${kr(res[1].y)}), F3 (${kr(res[2].y)}) og F1 (${kr(res[3].y)}).</p>`;
  body+=`<p>Fast rente bliver først billigere end F-kort, hvis renten i gennemsnit stiger mere end <b>${nf(be,1)} procentpoint</b> over de næste tre år og bliver der.</p>`;
  body+=`<p>Fast rente giver ro i hele lånets løbetid og er en forsikring. Stiger renten, falder kursen, og så kan I omlægge op og skære gæld væk. Falder renten, kan I omlægge ned.</p>`;
  body+=`<p>F5 er et mellemvalg: lavere rente end fast i dag og ro i 5 år ad gangen. Har I en gæld på over 4 gange indkomsten og låner over 60 % af boligens værdi, er F5 og fast rente som udgangspunkt de eneste muligheder, fordi renten skal ligge fast i mindst 5 år.</p>`;
  body+=`<p>F3, F1 og F-kort har den laveste rente nu, men renten kan ændre sig ofte. Vælg dem kun, hvis jeres budget kan holde til en markant højere ydelse. Ikke alle realkreditinstitutter tilbyder alle typer. Fx udsteder Totalkredit og Nordea Kredit ikke længere nye F1-lån.</p>`;
  return {tone:t,head,short:spread<P*0.01?"Næsten ingen forskel":`${LT[best.t].n} billigst over 10 år`,body,
   stats:[best].concat(res.filter(r=>r!==best)).map(r=>[`${LT[r.t].n} · ${pct(r.r0)}`,kr(r.y)+"/md.",r.t===best.t?"Billigst over 10 år":`${kr(r.cost-best.cost)} dyrere over 10 år`]),
   chart:{h:"Samlet pris over 10 år (betalt efter skat + restgæld)",html:hbars(res.map(r=>({l:LT[r.t].n,v:r.cost,c:r.t===best.t?"":"c3"})))},
   rule:"Ingen kan forudsige renten. Vælg den lånetype, hvor I kan sove om natten, også hvis renten stiger 3–4 procentpoint. Den billigste nu er ikke altid den billigste på lang sigt.",
   fine:`Renter pr. 17. november 2026 (skøn ud fra markedet): fast ${pct(R.fast)}, F5 ${pct(R.f5)}, F3 ${pct(R.f3)}, F1 ${pct(R.f1)}, F-kort ${pct(R.fkort)}. Bidrag er typiske satser ved 80 % belåning, og jo kortere rentebinding, jo højere bidrag. Renten antages at ændre sig gradvist over 3 år, og hvert lån får ny rente, når det tilpasses. Ikke med: kursen ved optagelse (fastforrentede lån optages ofte under kurs 100) og omkostninger ved rentetilpasning.`};
 }});

/* 4. Omlægning */
function omlNetto(P,rente,aar,mdr){ let b=P,paid=0; const y=ann(P,rente,aar),r=rente/1200;
  for(let i=0;i<mdr&&b>0.5;i++){ const it=b*r; paid+=y-it*fradragPct(it*12); b-=Math.min(b,y-it);} return {paid,rest:b,y}; }
tool({id:"omlaeg",ord:["Kurs","Omlægning op","Omlægning ned"],grp:"Bolig",ic:"pil",q:"Kan vi spare ved at omlægge boliglånet?",sub:"Om det kan betale sig at skifte til et lån med en anden rente",
 intro:"Ved en omlægning skifter du dit lån ud med et nyt med en anden rente. Indtast tallene fra din netbank, så kan du se, om det betaler sig efter 5 og 10 år.",
 f:["#Dit lån i dag","restgaeld","gRente","gKurs","aarTilbage","#Det nye lån","nRente","nKurs","omk"],
 calc(){ const indfri=S.restgaeld*Math.min(S.gKurs,100)/100+S.omk, nyH=indfri/(S.nKurs/100), dG=nyH-S.restgaeld;
  const o5=omlNetto(S.restgaeld,S.gRente,S.aarTilbage,60), n5=omlNetto(nyH,S.nRente,S.aarTilbage,60);
  const o10=omlNetto(S.restgaeld,S.gRente,S.aarTilbage,120), n10=omlNetto(nyH,S.nRente,S.aarTilbage,120);
  const g5=(o5.paid+o5.rest)-(n5.paid+n5.rest), g10=(o10.paid+o10.rest)-(n10.paid+n10.rest);
  const op = S.nRente>S.gRente; const dy=n5.y-o5.y;
  const t = g5>15000?"good": g10>0?"obs":"stop";
  const head = op? (dG<0? `En omlægning op skærer ${kr(-dG)} af din gæld, men ydelsen stiger ${kr(dy)} om måneden før skat.` : `Det giver ikke mening at omlægge op til den kurs.`)
                 : (g5>0? `Du sparer ca. ${kr(g5)} over 5 år ved at omlægge ned.` : `En omlægning ned kan ikke betale sig med de tal.`);
  let body = op? `<p>Når du omlægger op, køber du dit gamle lån tilbage til kurs ${nf(S.gKurs,1)} og optager et nyt med højere rente. Gælden bliver mindre, men du betaler mere i rente. Det er en god idé, hvis du regner med at sælge inden for nogle år, eller hvis du vil beskytte dig mod faldende boligpriser.</p>`
                : `<p>Når du omlægger ned, indfrier du dit lån til kurs 100 og tager et nyt med lavere rente. Gælden stiger typisk lidt, fordi det nye lån ligger under kurs 100, men ydelsen falder ${kr(-dy)} om måneden.</p>`;
  body+=`<p>Når jeg regner både ydelser efter skat og restgæld med, er du ${g5>=0?"foran":"bagud"} med ${kr(Math.abs(g5))} efter 5 år og ${g10>=0?"foran":"bagud"} med ${kr(Math.abs(g10))} efter 10 år.</p>`;
  if(op && S.gKurs>92) body+=`<p>Kursen på dit gamle lån er stadig høj. Der er ikke meget gæld at skære væk endnu. Jeg ville vente.</p>`;
  return {tone:t,head,short:`${g5>=0?"Gevinst":"Tab"} ca. ${kr(Math.abs(g5))} over 5 år`,body,
   stats:[["Ny gæld",kr(nyH)],["Ændring i gæld",(dG>0?"+":"")+kr(dG)],["Ny ydelse før skat",kr(n5.y)+"/md."],["Ændring i ydelse",(dy>0?"+":"")+kr(dy)+"/md."],["Resultat efter 5 år",(g5>=0?"+":"")+kr(g5)],["Resultat efter 10 år",(g10>=0?"+":"")+kr(g10)]],
   rule: op? "Omlægning op giver mest mening, når kursen er faldet en del, og I har råd til den højere ydelse. Det er især en fordel, hvis I regner med at sælge inden for nogle år. Få altid et konkret tilbud fra jeres bank."
            : "Omlægning ned giver typisk mening, når renten kan falde med omkring 1 procentpoint eller mere, og I bliver boende nogle år. Ellers kan gebyrerne æde gevinsten.",
   fine:"Bidragssats er antaget uændret. Kurtage og kursskæring ligger i gebyrerne. Stiger gælden, kan der komme tinglysningsafgift af stigningen. Rentefradraget er med."};
 }});

/* 5. Afdrag */
tool({id:"afdrag",ord:["Afdragsfrihed"],grp:"Bolig",ic:"trappe",q:"Skal vi betale af på boliglånet eller ej?",sub:"Hvad I sparer nu ved at lade være, og hvad det koster senere",
 intro:"Afdragsfrihed er ikke farligt i sig selv. Det afgør, hvad I bruger pengene til. Her ser I forskellen over 10 år.",
 f:["laan","aRente","laanetid","brug"],
 calc(){ const P=S.laan, med=ann(P,S.aRente,S.laanetid), uden=P*S.aRente/1200, diff=med-uden;
  const a10=amort(P,S.aRente,S.laanetid,120), efter=ann(P,S.aRente,Math.max(1,S.laanetid-10));
  const afk={opsparing:0.05*(1-R.askSkat),pension:0.05*(1-0.153),gaeld:0.10,forbrug:0}[S.brug];
  let v=0; for(let i=0;i<120;i++) v=v*(1+afk/12)+diff;
  const afdraget=P-a10.rest;
  const t = S.brug==="forbrug"?"stop": v>afdraget?"good":"obs";
  const head = S.brug==="forbrug"? `Hvis pengene bare forsvinder i forbrug, står I med ${kr(afdraget)} mere i gæld om 10 år.`
             : `Afdragsfrihed frigør ${kr(diff)} om måneden. Brugt fornuftigt er det ${kr(v)} værd om 10 år.`;
  let body=`<p>Med afdrag betaler I ${kr(med)} om måneden før skat og bidrag. Uden afdrag betaler I kun renten, ${kr(uden)}. Efter 10 år har I afdraget ${kr(afdraget)} på lånet.</p>`;
  body+=`<p>Pas på det, der sker, når de 10 år er gået: så skal hele lånet betales af på ${S.laanetid-10} år, og ydelsen stiger til ${kr(efter)} om måneden.</p>`;
  if(S.brug==="gaeld") body+=`<p>At bruge pengene på at betale dyr gæld ud er klogt. Et forbrugslån til 10 % koster meget mere end boliglånet.</p>`;
  if(S.brug==="pension") body+=`<p>At sætte pengene på pension kan give god mening, især hvis du får fradrag i mellem- eller topskat.</p>`;
  return {tone:t,head,short:`${kr(diff)}/md. frigjort`,body,
   stats:[["Ydelse med afdrag",kr(med)+"/md."],["Ydelse uden afdrag",kr(uden)+"/md."],["Afdraget på 10 år",kr(afdraget)],["Ydelse når frihed slutter",kr(efter)+"/md."],["Værdi af frigjorte penge",kr(v),S.brug==="forbrug"?"Brugt":"efter 10 år"]],
   chart:{h:"Efter 10 år",html:hbars([{l:"Gæld afdraget med afdrag",v:afdraget},{l:"Værdi af frigjorte penge",v:v,c:"c2"}])},
   rule:"Afdragsfrihed er et værktøj, ikke en lønforhøjelse. Bruger I pengene til forbrug, flytter I bare regningen ud i fremtiden – med renter.",
   fine:"Afkast ved opsparing: 5 % før skat på aktiesparekonto. Pension: 5 % før PAL-skat. Gæld: 10 % sparet rente. Lån uden afdrag har ofte et lidt højere bidrag, og det er ikke med. Afdragsfrihed i realkredit gives typisk i op til 10 år."};
 }});

/* 6. Bil */
tool({id:"bil",ord:["Restværdi","Førstegangsydelse"],grp:"Hverdag",ic:"bil",q:"Skal jeg købe eller lease bil?",sub:"Hvad bilen koster i alt over hele perioden",
 intro:"Leasing ser billigt ud pr. måned, og et køb ser dyrt ud på dag ét. Den eneste rigtige måde at sammenligne på er at se, hvad bilen koster dig i alt.",
 f:["#Bilen","bilPris","bilAar","bilService","#Hvis du køber","bilUdbet","bilRente","bilTab","#Hvis du leaser","lFoerste","lMd","lService"],
 calc(){ const P=Math.max(0,S.bilPris-S.bilUdbet), n=S.bilAar*12, laanAar=Math.max(S.bilAar,7);
  const a=amort(P,S.bilRente,laanAar,n), ydelser=a.ydelse*n, frad=a.renter*fradragPct(a.renter/S.bilAar);
  const rest=S.bilPris*Math.pow(1-S.bilTab/100,S.bilAar);
  const koeb=S.bilUdbet+ydelser-frad+S.bilService*n-(rest-a.rest);
  const leas=S.lFoerste+S.lMd*n+(S.lService==="nej"?S.bilService*n:0); const d=leas-koeb;
  const t = Math.abs(d)<koeb*0.05?"info":"good";
  const head = Math.abs(d)<Math.max(koeb,leas)*0.05? `Med dine tal koster det næsten det samme at købe og lease over ${S.bilAar} år. Så handler det mest om, hvad du foretrækker.`
    : d>0? `Med dine tal er det ca. ${kr(d)} billigere at købe bilen over ${S.bilAar} år.` : `Med dine tal er det ca. ${kr(-d)} billigere at lease bilen over ${S.bilAar} år.`;
  let body=`<p>Køber du, koster bilen dig ${kr(koeb/n)} om måneden, når jeg har trukket det fra, du får for den, når du sælger. Leaser du, koster den ${kr(leas/n)} om måneden.</p>`;
  body+=`<p>Efter ${S.bilAar} år er bilen ca. ${kr(rest)} værd. Det er dine penge, hvis du ejer den. Leaser du, ejer du ingenting.</p>`;
  body+=`<p>Leasing giver mening, hvis du vil have en ny bil hvert 3. år og vil undgå overraskelser. Køb giver mening, hvis du beholder bilen længe.</p>`;
  return {tone:t,head,short:d>0?`Køb ca. ${kr(d)} billigere`:`Leasing ca. ${kr(-d)} billigere`,body,
   stats:[["Køb pr. md.",kr(koeb/n)],["Leasing pr. md.",kr(leas/n)],["Bilens restværdi",kr(rest)],["Billån tilbage ved salg",kr(a.rest)]],
   chart:{h:`Samlet pris over ${S.bilAar} år`,html:hbars([{l:"Købe",v:koeb},{l:"Lease",v:leas,c:"c2"}])},
   rule:"Det dyreste ved en ny bil er værditabet de første 3 år. Køb gerne en bil, der er 2–3 år gammel, og behold den længe. Så har en anden betalt det store tab.",
   fine:"Rentefradrag på billånet er med. Ikke med: renter du kunne have fået af udbetalingen, og ekstraregninger ved leasing, fx for flere kilometer end aftalt eller skader ved aflevering. Forsikring og ejerafgift er antaget at være ens."};
 }});

/* 7. Gæld */
tool({id:"gaeld",ord:["Rentefradrag"],grp:"Gæld og opsparing",ic:"gaeld",q:"Hvilken gæld skal jeg betale af først?",sub:"Din plan for at blive gældfri, og hvornår du er der",
 intro:"Skriv din gæld ind. Jeg sætter den i den rækkefølge, der giver mindst rente, og viser dig, hvornår du er gældfri.",
 f:["#Din gæld","d1","r1","d2","r2","d3","r3","d4","r4","#Din plan","betaling"],
 calc(){ const names=["Kreditkort/kassekredit","Forbrugslån","Billån","Andet lån"];
  let debts=[1,2,3,4].map((i,k)=>({n:names[k],b:S["d"+i],r:S["r"+i]})).filter(d=>d.b>0);
  const total=debts.reduce((s,d)=>s+d.b,0);
  if(!debts.length) return {tone:"good",head:"Du har ingen gæld at betale af. Det er det bedste udgangspunkt, der findes.",short:"Ingen gæld",body:"<p>Brug i stedet pengene på en buffer og derefter opsparing.</p>",stats:[],rule:"Hold den sådan. Køb ting kontant, og lån kun til bolig."};
  const order=[...debts].sort((a,b)=>b.r-a.r);
  const rente1=debts.reduce((s,d)=>s+d.b*d.r/1200,0);
  if(S.betaling<=rente1) return {tone:"stop",head:`Du betaler ikke engang renterne. De er ${kr(rente1)} om måneden.`,short:"Betalingen dækker ikke renterne",
   body:`<p>Med ${kr(S.betaling)} om måneden vokser gælden. Det skal løses nu. Kontakt din bank om at samle gælden i ét billigere lån, og skær ned på udgifterne.</p>`,stats:[["Samlet gæld",kr(total)],["Renter pr. md.",kr(rente1)]],rule:"Gæld, der vokser af sig selv, går aldrig væk af sig selv. Tag fat i det i dag."};
  const sim=(sorted)=>{ let ds=sorted.map(d=>({...d})),m=0,int=0,ser=[]; while(ds.some(d=>d.b>0.5)&&m<600){ let pay=S.betaling;
    ds.forEach(d=>{ const it=d.b*d.r/1200; d.b+=it; int+=it; }); for(const d of ds){ const p=Math.min(d.b,pay); d.b-=p; pay-=p; if(pay<=0) break; } m++; if(m%6===0) ser.push(ds.reduce((s,d)=>s+d.b,0)); } return {m,int,ser}; };
  const best=sim(order), worst=sim([...debts].sort((a,b)=>a.r-b.r));
  const yrs=Math.floor(best.m/12), mo=best.m%12;
  const head=`Du er gældfri om ${yrs?yrs+" år og ":""}${mo} ${mo===1?"måned":"måneder"}, hvis du betaler i den her rækkefølge.`;
  let body=`<p>Betal minimum på alt, og læg resten på <b>${esc(order[0].n)}</b> med ${pct(order[0].r)} i rente. Når den er væk, tager du den næste.</p><p>Rækkefølge: ${order.map((d,i)=>`${i+1}. ${esc(d.n)} (${pct(d.r)})`).join(" · ")}</p>`;
  if(worst.int-best.int>500) body+=`<p>Det sparer dig ${kr(worst.int-best.int)} i renter i forhold til at starte med det billigste lån.</p>`;
  if(order[0].r>8) body+=`<p>Når du betaler gæld med ${pct(order[0].r)} i rente af, er det det samme som at få ${pct(order[0].r*(1-0.26))} i afkast efter skat. Helt uden risiko. Det slår næsten enhver investering.</p>`;
  return {tone:best.m<=36?"good":"obs",head,short:`Gældfri om ${yrs} år ${mo} md.`,body,
   stats:[["Samlet gæld",kr(total)],["Renter i alt",kr(best.int)],["Renter pr. md. nu",kr(rente1)],["Gældfri om",`${best.m} måneder`]],
   chart:{h:"Din gæld falder",html:lines([{n:"Restgæld",d:[total,...best.ser]}],[0,...best.ser.map((_,i)=>((i+1)*0.5).toString().replace(".",","))],"år")},
   rule:"Betal den dyreste gæld først. Men hav en lille buffer på 10–20.000 kr., inden du betaler ekstra af. Ellers ender du med at låne igen, næste gang noget går i stykker.",
   fine:"Rentefradraget er ikke regnet med i månederne. Det gør dig lidt hurtigere gældfri, end jeg viser."};
 }});

/* 8. Buffer */
tool({id:"buffer",ord:["Buffer","A-kasse"],grp:"Gæld og opsparing",ic:"skjold",q:"Hvor mange penge skal jeg have i reserve?",sub:"Din buffer til det uforudsete, tilpasset dit job og din familie",
 intro:"En buffer er penge, du ikke rører. De er der, når bilen går i stykker, eller jobbet forsvinder. Hvor stor den skal være, afhænger af, hvor sikker din indtægt er.",
 f:["udg","job","voksne","aKasse","harBuffer","spar"],
 calc(){ let mdr={offentlig:3,privat:4,selv:6}[S.job]; if(S.voksne==1) mdr+=1; if(S.aKasse==="nej") mdr+=2;
  const maal=mdr*S.udg, mangler=Math.max(0,maal-S.harBuffer), tid=S.spar>0?Math.ceil(mangler/S.spar):Infinity;
  const t= mangler===0?"good": S.harBuffer>=maal*0.5?"obs":"stop";
  const head= mangler===0? `Din buffer er på plads. Du har ${kr(S.harBuffer)} og skal bruge ${kr(maal)}.` : `Din buffer bør være ${kr(maal)}. Du mangler ${kr(mangler)}.`;
  let body=`<p>Med din situation anbefaler jeg ${mdr} måneders faste udgifter. ${S.aKasse==="nej"?"Fordi du ikke er i a-kasse, har jeg lagt 2 måneder ekstra på. Overvej, om det kan betale sig for dig at melde dig ind.":""}</p>`;
  if(mangler>0) body+= isFinite(tid)? `<p>Sparer du ${kr(S.spar)} op om måneden, er du i mål om ${tid} måneder.</p>`:`<p>Find et beløb, du kan sætte til side hver måned. Selv 500 kr. om måneden gør en forskel.</p>`;
  else if(S.harBuffer>maal*1.5) body+=`<p>Du har faktisk ${kr(S.harBuffer-maal)} mere end nødvendigt. Penge, du ikke skal bruge de næste 5 år, kan du overveje at investere. Penge, du kan få brug for, skal blive på kontoen.</p>`;
  return {tone:t,head,short:mangler?`Mangler ${kr(mangler)}`:"Bufferen er på plads",body,
   stats:[["Mål for buffer",kr(maal)],["Måneder",String(mdr)],["Du har",kr(S.harBuffer)],["I mål om",mangler?(isFinite(tid)?tid+" md.":"–"):"Nu"]],
   chart:{h:"Din buffer",html:hbars([{l:"Har nu",v:S.harBuffer},{l:"Mål",v:maal,c:"c2"}])},
   rule:"Hold bufferen på en separat konto, du ikke ser hver dag. Så bliver den ikke brugt på tilbud."};
 }});

/* 9. Opsparing */
function afkastPa(){ return {lav:2,mellem:5,hoej:7}[S.risiko]; }
tool({id:"opsparing",ord:["Aktiesparekonto","ÅOP","Lagerbeskatning"],grp:"Gæld og opsparing",ic:"vaekst",q:"Hvad bliver min opsparing værd?",sub:"Hvad pengene kan vokse til, når skat og gebyrer er trukket fra",
 intro:"Det stærkeste værktøj i økonomi er tid. Her kan du se, hvad din opsparing kan vokse til, og hvor meget af det der er afkast.",
 f:["start","md","aar","risiko","konto","aop"],
 calc(){ const r=afkastPa(), n=S.aar*12;
  let net; if(S.konto==="ask") net=(r-S.aop)*(1-R.askSkat); else if(S.konto==="frie") net=(r-S.aop); else net=1.5*(1-0.37);
  let v=S.start, ind=S.start; const ser=[S.start], serInd=[S.start];
  for(let i=1;i<=n;i++){ v=v*(1+net/1200)+S.md; ind+=S.md; if(i%12===0){ ser.push(v); serInd.push(ind);} }
  let skatSlut=0; if(S.konto==="frie"){ const g=v-ind; skatSlut=Math.min(g,R.aktieGr*(S.voksne==2?2:1))*R.aktieLav+Math.max(0,g-R.aktieGr*(S.voksne==2?2:1))*R.aktieHoj; v-=skatSlut; ser[ser.length-1]=v; }
  const afkast=v-ind;
  let body=`<p>Du sætter i alt ${kr(ind)} ind. Afkastet efter skat og omkostninger bliver ca. ${kr(afkast)}. ${afkast>ind?"Dine penge har altså tjent mere, end du selv har sat ind.":""}</p>`;
  if(S.konto==="ask" && ind>R.ask) body+=`<p>Pas på: aktiesparekontoen har et loft på ${krx(R.ask)} i indskud i 2026. Det, der er over, skal på et almindeligt depot.</p>`;
  if(S.konto==="bank") body+=`<p>På en bankkonto taber pengene typisk til inflationen. Det er fint til bufferen, men ikke til penge, du ikke skal bruge de næste 5 år.</p>`;
  if(S.konto==="frie") body+=`<p>På et almindeligt depot betaler du ${pct(27,0)} skat af gevinsten op til ${krx(R.aktieGr)} om året pr. person og ${pct(42,0)} af resten, når du sælger. Jeg har trukket ${kr(skatSlut)} i skat til sidst.</p>`;
  const tidl=(()=>{ let x=S.start; for(let i=1;i<=n+60;i++) x=x*(1+net/1200)+S.md; return x; })();
  return {tone:"info",head:`Om ${S.aar} år har du ca. <span class="num">${kr(v)}</span>.`,short:`Ca. ${kr(v)} om ${S.aar} år`,body,
   stats:[["Slutværdi",kr(v)],["Indbetalt",kr(ind)],["Afkast efter skat",kr(afkast)],["Hvis du sparer 5 år længere",kr(tidl)]],
   chart:{h:"Sådan vokser pengene",html:lines([{n:"Værdi",d:ser},{n:"Indbetalt",d:serInd}],ser.map((_,i)=>i),"år")},
   rule:"Spar op automatisk den dag, lønnen går ind. Det, du ikke ser, savner du ikke. Og hold øje med omkostningerne: 1 procentpoint mere om året kan over 30 år koste en fjerdedel af det, du ellers ville have tjent.",
   fine:"Afkast er forventninger, ikke garantier, og aktier kan falde. Aktiesparekonto beskattes med 17 % af gevinsten hvert år. På et almindeligt depot afhænger skatten af, hvilke fonde du ejer. Bankkonto antaget 1,5 % i rente."};
 }});

/* 10. Børn */
tool({id:"boern",ord:["Børneopsparing","Aktiesparekonto"],grp:"Familie",ic:"barn",q:"Hvordan sparer vi bedst op til vores barn?",sub:"Børneopsparing og aktiesparekonto i den rigtige rækkefølge",
 intro:"Der findes to gode muligheder, og de kan bruges sammen. Rækkefølgen betyder noget, fordi den ene er skattefri.",
 f:["barnAlder","barnMd","barnTil","risiko"],
 calc(){ const til=+S.barnTil, aar=Math.max(1,til-S.barnAlder), r=afkastPa(), net=r-0.5;
  const tilBO=Math.min(S.barnMd*12,R.boerneAar), tilASK=Math.max(0,S.barnMd*12-R.boerneAar);
  let bo=0,ask=0,indBO=0; for(let y=0;y<aar;y++){ const add=Math.min(tilBO,R.boerneMax-indBO); indBO+=add; bo=(bo+add)*(1+net/100); ask=(ask+tilASK)*(1+net*(1-R.askSkat)/100); }
  const tot=bo+ask, ind=indBO+tilASK*aar;
  let body=`<p>Fyld først børneopsparingen op med op til ${krx(R.boerneAar)} om året (${krx(R.boerneAar/12)} om måneden). Den er helt skattefri, og pengene kan investeres. Loftet er ${krx(R.boerneMax)} i alt.</p>`;
  body+= tilASK>0? `<p>Det, du sparer op ud over ${krx(R.boerneAar)} om året, går på barnets egen aktiesparekonto. Den beskattes med 17 %, men barnet har sit eget loft.</p>` : `<p>Vil du spare mere op senere, kan barnet få sin egen aktiesparekonto med eget loft.</p>`;
  body+=`<p>Husk: Bedsteforældre må også give op til ${krx(R.gaveBoern)} om året skattefrit pr. person til hvert barnebarn.</p>`;
  return {tone:"good",head:`Når dit barn fylder ${til}, er der ca. <span class="num">${kr(tot)}</span>.`,short:`Ca. ${kr(tot)} ved ${til} år`,body,
   stats:[["Børneopsparing",kr(bo),"Skattefri"],["Barnets aktiesparekonto",kr(ask)],["I sætter ind",kr(ind)],["Afkast",kr(tot-ind)]],
   chart:{h:`Fordeling ved ${til} år`,html:hbars([{l:"Børneopsparing",v:bo},{l:"Aktiesparekonto",v:ask,c:"c2"}])},
   rule:"Børneopsparingen er bundet i mindst 7 år. Vælg investering i stedet for fast rente, hvis der er mere end 10 år til udbetaling. Og overvej, om pengene først skal udbetales ved 21. Ikke alle 18-årige træffer de klogeste valg.",
   fine:"Forventet afkast efter 0,5 % i omkostninger. Satser 2026: børneopsparing 6.000 kr./år, maks. 72.000 kr."};
 }});

/* 11. Pension */
tool({id:"pension",ord:["Folkepensionsalder","Pensionstillæg"],grp:"Pension",ic:"ur",q:"Hvornår kan jeg gå på pension, og hvad får jeg?",sub:"Din folkepensionsalder og hvad du kan forvente om måneden",
 intro:"Folkepensionsalderen stiger, og den afhænger af, hvornår du er født. Her kan du se din, og om din opsparing rækker.",
 f:["#Dig","fAar","voksne","loen1","#Din pension","pensNu","pensPct","pensAfk","oenskAlder"],
 calc(){ const fpa=fpAlder(S.fAar), alder=thisYear-S.fAar, mål=S.oenskAlder||fpa, aar=Math.max(0,mål-alder);
  const real={lav:1.5,mellem:3,hoej:4}[S.pensAfk]; let v=S.pensNu; const ser=[v], xs=[alder];
  for(let y=0;y<aar;y++){ v=v*(1+real/100)+S.loen1*12*S.pensPct/100; ser.push(v); xs.push(alder+y+1); }
  const udbAar=Math.max(1,90-mål), r=real/1200, mdUdb= r? v*r/(1-Math.pow(1+r,-udbAar*12)) : v/(udbAar*12);
  const fp=R.fpGrund+(S.voksne==2?R.fpTillPar:R.fpTillEnlig);
  const ialt=mdUdb+(mål>=fpa?R.fpGrund:0), dg=ialt/Math.max(1,S.loen1);
  const t= dg>=0.7?"good": dg>=0.55?"obs":"stop";
  const tidlig=Math.max(0,fpa-mål);
  let body=`<p>Du er født i ${S.fAar}, så din folkepensionsalder er <b>${fpa} år</b> efter de love, der er vedtaget i dag. Den kan blive hævet igen senere.</p>`;
  body+=`<p>Med din nuværende opsparing og indbetaling har du ca. ${kr(v)} i dagens kroner, når du er ${mål}. Det giver ca. ${kr(mdUdb)} om måneden før skat frem til du er 90${mål>=fpa?`, plus folkepensionens grundbeløb på ${krx(R.fpGrund)}`:""}.</p>`;
  if(tidlig) body+=`<p>Vil du stoppe ${tidlig} år før folkepensionen, skal din egen opsparing betale det hele i de år.</p>`;
  body+= dg>=0.7? `<p>Det svarer til ${pct(dg*100,0)} af din løn i dag. Det er flot. De fleste har det fint med 70–80 %.</p>` : `<p>Det svarer til ${pct(dg*100,0)} af din løn i dag. Jeg ville gerne se dig over 70 %. Hæv din pensionsprocent med 2–3 point, eller spar op ved siden af.</p>`;
  return {tone:t,head:`Din folkepensionsalder er ${fpa}. Ved ${mål} får du ca. <span class="num">${kr(ialt)}</span> om måneden før skat.`,short:`Ca. ${kr(ialt)}/md. fra ${mål} år`,body,
   stats:[["Folkepensionsalder",fpa+" år"],["Opsparing ved "+mål,kr(v)],["Fra pensionsordninger",kr(mdUdb)+"/md."],["Folkepension maks.",kr(fp)+"/md.",S.voksne==2?"Gift/samlevende":"Enlig"],["I forhold til løn i dag",pct(dg*100,0)],["Udbetalingsår",udbAar+" år"]],
   chart:{h:"Din pensionsopsparing i dagens kroner",html:lines([{n:"Opsparing",d:ser}],xs,"alder")},
   rule:"Hent dit overblik på pensionsinfo.dk én gang om året. Det tager 10 minutter og giver det mest præcise billede af din pension.",
   fine:`Afkast efter inflation og omkostninger: forsigtigt 1,5 %, middel 3 %, offensivt 4 %. Folkepension 2026: grundbeløb ${krx(R.fpGrund)}, tillæg op til ${krx(R.fpTillEnlig)} (enlig) eller ${krx(R.fpTillPar)} (par). Tillægget sættes ned, hvis du har anden indkomst.`};
 }});

/* 12. Ratepension eller aldersopsparing */
tool({id:"pensform",ord:["Marginalskat","Pensionstillæg","Tiårsreglen"],grp:"Pension",ic:"vaegt",q:"Hvilken pensionsopsparing skal jeg vælge?",sub:"Ratepension eller aldersopsparing: hvad giver mest efter skat",
 intro:"Ratepension giver fradrag nu, men beskattes ved udbetaling. Aldersopsparing giver intet fradrag, men er skattefri ved udbetaling. Det rigtige valg afhænger af din skat nu og som pensionist.",
 f:["loen1","fAar","pensIndk"],
 calc(){ const a=S.loen1*12, t=skat(a,S.pens), m=marginal(a,S.pens), fpa=fpAlder(S.fAar), tilFP=fpa-(thisYear-S.fAar);
  let valg,t2,why=[];
  if(t.pi>R.mellemGr){ valg="Ratepension"; t2="good"; why.push(`Du betaler mellemskat${t.pi>R.topGr?" og topskat":""}. Indbetaler du på ratepension, sparer du ca. ${pct(m*100,0)} i skat af hver krone, du sætter ind. Det beløb får du sjældent tilbage i skat som pensionist.`); }
  else if(tilFP<=7){ valg="Aldersopsparing"; t2="good"; why.push(`Du har ${Math.max(0,tilFP)} år til folkepension. Så må du sætte op til ${krx(R.aldersMax)} om året ind på aldersopsparing i 2026. Pengene er skattefri ved udbetaling og nedsætter ikke dit pensionstillæg.`); }
  else if(S.pensIndk==="lav"){ valg="Aldersopsparing først"; t2="good"; why.push(`Med en lav forventet pension får du sandsynligvis pensionstillæg. Udbetalinger fra ratepension sætter tillægget ned, så den reelle skat kan blive meget højere end din skat i dag. Aldersopsparing gør ikke.`); }
  else { valg="Ratepension"; t2="info"; why.push(`Du får fradrag i dag med ca. ${pct(m*100,0)}, og med en mellem eller høj pension får du ikke pensionstillæg alligevel. Brug gerne aldersopsparingen på ${krx(R.aldersAlm)} om året også.`); }
  why.push(`Ratepension: fradrag op til ${krx(R.rateLoft)} om året i 2026 (samlet for alle ordninger). Udbetales over mindst 10 år og beskattes som almindelig indkomst.`);
  why.push(`Aldersopsparing: ${krx(R.aldersAlm)} om året, eller op til ${krx(R.aldersMax)} hvis du har 7 år eller mindre til folkepension. Intet fradrag, skattefri ved udbetaling.`);
  if(tilFP>0) why.push(`Det ekstra pensionsfradrag: du får ${tilFP<=15?"32 %":"12 %"} ekstra fradrag af indbetalinger op til ${krx(87800)}, fordi du har ${tilFP<=15?"15 år eller mindre":"mere end 15 år"} til folkepension.`);
  why.push("Pension er indviklet, og det rigtige valg afhænger af hele din situation. Tal med dit pensionsselskab, før du ændrer noget.");
  return {tone:"info",head:`Med dine tal peger det mod: <b>${valg}</b>.`,short:"Peger mod: "+valg,body:why.map(w=>`<p>${w}</p>`).join(""),
   stats:[["Din marginalskat",pct(m*100,0)],["År til folkepension",String(Math.max(0,tilFP))],["Loft ratepension",krx(R.rateLoft)],["Loft aldersopsparing",kr(tilFP<=7?R.aldersMax:R.aldersAlm)]],
   rule:"Spørg dig selv: Hvad sparer jeg i skat nu, og hvad betaler jeg i skat, når pengene kommer ud? Er det første tal størst, taler det for ratepension.",
   fine:"Fradraget er beregnet, som hvis du indbetaler gennem din arbejdsgiver. Indbetaler du selv, sparer du ikke AM-bidraget, så fradraget er lidt mindre. Får du løbende udbetalinger fra en pension, der giver fradrag, inden for 10 år før din folkepensionsalder, kan du kun indbetale det lave beløb på aldersopsparing."};
 }});

/* 13. Gaver */
tool({id:"gave",ord:["Gaveafgift","Boafgift"],grp:"Familie",ic:"gave",q:"Hvor meget kan vi give børnene skattefrit?",sub:"Gaver til børn, børnebørn og svigerbørn i 2026",
 intro:"Mange forældre vil gerne hjælpe børnene, mens de lever. Her kan du se, hvor meget I kan give hvert år uden at betale afgift.",
 f:["givere","gBoern","gBarnebarn","gSvig","gBeloeb"],
 calc(){ const g=+S.givere, frit=g*R.gaveBoern, ialt=g*((S.gBoern+S.gBarnebarn)*R.gaveBoern+S.gSvig*R.gaveSvig);
  const over=Math.max(0,S.gBeloeb-frit), afg=over*R.afgift;
  const t= over>0?"obs":"good";
  const head = over>0? `Giver I ${kr(S.gBeloeb)} til hvert barn, skal der betales ${kr(afg)} i gaveafgift pr. barn.` : `I kan give hvert barn ${kr(S.gBeloeb)} uden at betale afgift. Der er plads til ${kr(frit-S.gBeloeb)} mere.`;
  let body=`<p>I 2026 må hver forælder give ${krx(R.gaveBoern)} skattefrit til hvert barn og barnebarn. Til svigerbørn er grænsen ${krx(R.gaveSvig)}. ${g==2?"Da I er to, kan I give det dobbelte.":""}</p>`;
  if(over>0) body+=`<p>Det, der ligger over grænsen, beskattes med 15 % gaveafgift. Mit råd: Del gaven over to år. Så er den skattefri. Gaven tæller fra 1. januar, så et beløb givet i december og et i januar er to forskellige år.</p>`;
  body+=`<p>Ved arv er bundfradraget ${krx(R.boBund)} i 2026. Arv derover til børn beskattes med 15 % boafgift.</p>`;
  return {tone:t,head,short:`Skattefrit i alt: ${krx(ialt)}/år`,body,
   stats:[["Skattefrit pr. barn",krx(frit)],["Skattefrit i alt pr. år",krx(ialt)],["Afgift pr. barn",kr(afg)],["Bundfradrag ved arv",krx(R.boBund)]],
   chart:{h:"Pr. barn",html:hbars([{l:"Skattefrit",v:frit,t:krx(frit)},{l:"Jeres gave",v:S.gBeloeb,t:krx(S.gBeloeb),c:over>0?"c4":"c2"}])},
   rule:"Giv gaver med varm hånd, og giv dem hvert år. Over 10 år kan to forældre give hvert barn over 1,6 millioner kroner uden afgift.",
   fine:"Ægtefæller kan give hinanden gaver uden afgift. Ved større overdragelser, fx af en bolig, skal I tale med en advokat."};
 }});

/* 14. Leje eller eje */
tool({id:"lejeeje",ord:["Handelsomkostninger"],grp:"Bolig",ic:"noegle",q:"Skal jeg leje eller købe?",sub:"Hvad du står med til sidst, når alt er regnet med",
 intro:"Det handler ikke om, hvad der er billigst pr. måned. Det handler om, hvad du har tilbage, når du flytter igen. Her regner jeg begge veje.",
 f:["#I dag","husleje","#Hvis du køber","pris","type","m2","byggeaar","varme","opsparing","voksne","loen1","loen2","driftValg","drift","#Forudsætninger","lejeAar","prisStig","alt"],
 calc(){ const b=bolig(S.pris), n=S.lejeAar*12; const salg=0.025;
  let rest=b.realk,restB=b.bank,ejerUd=0,lejeUd=0,invest=S.opsparing; const rr=R.fast/1200, rb=R.bankRente/1200;
  const yR=ann(b.realk,R.fast,30), yB=ann(b.bank,R.bankRente,20); const altM=S.alt*(1-R.askSkat)/1200;
  let leje=S.husleje; const sE=[],sL=[];
  for(let i=0;i<n;i++){
    const itR=rest*rr, itB=restB*rb, bid=rest*bidrag(80,false)/1200; const fr=(itR+itB+bid)*fradragPct((itR+itB+bid)*12);
    const ejerMd=(rest>0?yR:0)+(restB>0?yB:0)+bid-fr+b.skatter+b.drift;
    rest-=Math.min(rest,yR-itR); restB-=Math.min(restB,yB-itB);
    if(i%12===0&&i>0) leje*=1.02;
    const d=ejerMd-leje; invest=invest*(1+altM)+Math.max(0,d); ejerUd+=Math.max(0,-d);
    if(i%12===11){ const v=S.pris*Math.pow(1+S.prisStig/100,(i+1)/12); sE.push(v*(1-salg)-rest-restB+ejerUd); sL.push(invest); }
  }
  const vaerdi=S.pris*Math.pow(1+S.prisStig/100,S.lejeAar), ejerF=vaerdi*(1-salg)-rest-restB+ejerUd, lejerF=invest, d=ejerF-lejerF;
  const t= Math.abs(d)<50000?"info":"good";
  const head= Math.abs(d)<Math.max(Math.abs(ejerF),Math.abs(lejerF),1)*0.05? `Med dine tal er det tæt på lige efter ${S.lejeAar} år. Det afhænger mest af, hvordan boligpriserne udvikler sig.`
    : d>0? `Med dine tal står du ca. ${kr(d)} bedre efter ${S.lejeAar} år ved at købe. Men det afhænger meget af boligpriserne.` : `Med dine tal står du ca. ${kr(-d)} bedre efter ${S.lejeAar} år ved at leje. Men det afhænger meget af boligpriserne.`;

  if(S.lejeAar<5) body+=`<p>Under 5 år er det svært at tjene handelsomkostningerne ind. Er du i tvivl om, hvor længe du bliver, så lej.</p>`;

const PREP=new Set(["en","et","dag","forhold","realkredit","hvor","mål","så","de","alt","alle","perioden","banken","år","nogle","mange","midten","gennemsnit","ejerforeningen","starten","løbet","praksis","princippet"]);

function single(id){ if(id==="gave" && K().givere===true) return S.givere==1; return K().voksne===true && S.voksne==1; }
function du(str,id){ if(str==null) return str; str=String(str); if(!single(id)) return str;
  return str
   .replace(new RegExp("(^|[.!?:]\\s+|>\\s*|\"\\s*|\\(\\s*)I(\\s+)(["+LET+"0-9]+)","g"),(m,a,sp,w)=> PREP.has(w.toLowerCase())? m : a+"Du"+sp+w)
   .replace(new RegExp("([a-zæøå,])(\\s+)I(?!["+LET+"])","g"),"$1$2du")
   .replace(new RegExp("(^|[^"+LET+"])([Jj])eres(\\s+)(["+LET+".]+)((?:\\s+["+LET+".]+)?)","g"),(m,pre,J,sp,w1,w2)=>{
      const ws=[w1,w2.trim()].map(x=>x.toLowerCase().replace(/\.$/,"")); let f=ws.some(x=>DINE.has(x))?"dine":ws.some(x=>DIT.has(x))?"dit":"din";
      if(J==="J") f=f[0].toUpperCase()+f.slice(1); return pre+f+sp+w1+w2; })
   .replace(new RegExp("(^|[^"+LET+"])jer(?!["+LET+"])","g"),"$1dig"); }
function duQ(str,id){ str=du(str,id); if(!single(id)) return str;
  return str.replace(new RegExp("(^|[^"+LET+"])([Vv])i(?!["+LET+"])","g"),(m,p,V)=>p+(V==="V"?"Jeg":"jeg"))
            .replace(new RegExp("(^|[^"+LET+"])vores(\\s+)(barn|hus|budget)","g"),"$1mit$2$3")
            .replace(new RegExp("(^|[^"+LET+"])vores(?!["+LET+"])","g"),"$1min"); }
function duR(r,id){ if(!r||!single(id)) return r; const o=Object.assign({},r);
  ["head","body","short","rule","fine"].forEach(k=>{ if(o[k]) o[k]=du(o[k],id); });
  if(o.notes) o.notes=o.notes.map(x=>du(x,id)); if(o.notesTitle) o.notesTitle=du(o.notesTitle,id); if(o.notesLead) o.notesLead=du(o.notesLead,id);
  if(o.stats) o.stats=o.stats.map(x=>x.map(y=>du(y,id)));
  if(o.chart) o.chart={h:du(o.chart.h,id),html:du(o.chart.html,id)}; return o; }

    const f=F[k]; const w=document.createElement("div"); w.className="field"; w.dataset.k=k; const id="f-"+k;
    if(f.t==="seg"){
      w.innerHTML=`<div class="lab" id="${id}-l">${esc(fl(k,current))}</div><div class="seg" role="group" aria-labelledby="${id}-l">${f.o.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(S[k])===String(v)}">${esc(l)}</button>`).join("")}</div>${f.h?`<div class="hint">${esc(fh(k,current))}</div>`:""}`;
      w.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const raw=b.dataset.v; S[k]= typeof f.o[0][0]==="number"? +raw : raw; save();
        w.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); changed(k); });
    } else if(f.t==="step"){
      w.innerHTML=`<div class="frow" style="align-items:center"><span class="lab" id="${id}-l">${esc(fl(k,current))}</span><span class="step" role="group" aria-labelledby="${id}-l"><button type="button" aria-label="Færre">−</button><output aria-live="polite">${S[k]}</output><button type="button" aria-label="Flere">+</button></span></div>${f.h?`<div class="hint">${esc(fh(k,current))}</div>`:""}`;
      const [mi,pl]=w.querySelectorAll("button"), out=w.querySelector("output");
      const sync=()=>{ out.textContent=S[k]+(f.u?" "+f.u:""); mi.disabled=S[k]<=f.min; pl.disabled=S[k]>=f.max; };
      mi.onclick=()=>{ S[k]=Math.max(f.min,S[k]-1); sync(); save(); changed(k); };
      pl.onclick=()=>{ S[k]=Math.min(f.max,S[k]+1); sync(); save(); changed(k); };
      sync();
